# Temporary smoke-test config: small symbol set + short poll intervals so a
# ~3 minute live run can verify every intended table fills. Not for production.
# Durable store = ClickHouse + zstd archive. SQLite is ephemeral (deleted after
# stop when persist:false). For checklist validation keep persist:true for that run.
database:
  path: data/market_{run_id}.db
  persist: false

products:
  spot:
    enabled: true
    rest_base_url: https://api.binance.com
    ws_base_url: wss://stream.binance.com:9443
    rest_weight_per_minute: 1200
    symbol_universe: list
    symbol_list: ["BTCUSDT", "ETHUSDT"]
    instrument_poll_minutes: 60
    kline_intervals: ["1m"]
    depth:
      enabled: true
      mode: top_n
      top_n: 1
      ranking: quote_volume
      refresh_minutes: 1

  usdm_futures:
    enabled: true
    rest_base_url: https://fapi.binance.com
    ws_base_url: wss://fstream.binancefuture.com
    rest_weight_per_minute: 2000
    symbol_universe: list
    symbol_list: ["BTCUSDT", "ETHUSDT"]
    instrument_poll_minutes: 60
    kline_intervals: ["1m"]
    depth:
      enabled: true
      mode: top_n
      top_n: 1
      ranking: quote_volume
      refresh_minutes: 1
    funding_poll_minutes: 5
    open_interest_poll_minutes: 1
    positioning_poll_minutes: 1

  coinm_futures:
    enabled: true
    rest_base_url: https://dapi.binance.com
    ws_base_url: wss://dstream.binance.com
    rest_weight_per_minute: 2000
    symbol_universe: list
    symbol_list: ["BTCUSD_PERP", "ETHUSD_PERP"]
    instrument_poll_minutes: 60
    kline_intervals: ["1m"]
    depth:
      enabled: true
      mode: top_n
      top_n: 1
      ranking: quote_volume
      refresh_minutes: 1
    funding_poll_minutes: 5
    open_interest_poll_minutes: 1
    positioning_poll_minutes: 1

  options:
    enabled: true
    rest_base_url: https://eapi.binance.com
    ws_base_url: wss://fstream.binancefuture.com/eoptions
    rest_weight_per_minute: 400
    symbol_universe: list
    symbol_list: ["BTC-260828-65000-C", "BTC-260828-65000-P"]
    instrument_poll_minutes: 60
    kline_intervals: ["1m"]

rate_limits:
  ws_connections_per_5min: 150
  max_streams_per_connection: 100

sinks:
  clickhouse:
    enabled: true
    url: http://127.0.0.1:8123
    user: default
    password: bench
    database: bmo_{run_id}
    batch_size: 200
  raw_archive:
    enabled: true
    path: data/archive_{run_id}/raw.ndjson.zst
    rotate: none
