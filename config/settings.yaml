# Capability registry (docs/THESIS.md #7). Changing what gets collected,
# which symbols, or the rate-limit budget is a config edit here, not a code
# change -- when Binance changes its API surface, fix it here first.
#
# Rate-limit numbers below are deliberately conservative fractions of
# Binance's long-documented public defaults. RestWeightLimiter self-corrects
# against the exchange's own reported used-weight header, so drift in these
# defaults degrades gracefully rather than causing a ban -- but re-verify
# them against Binance's current docs periodically regardless.

database:
  # {run_id} is substituted with a UTC timestamp (YYYYmmddTHHMMSSZ) once per
  # process start, so each start/stop cycle gets its own file -- see
  # docs/requirements/2026-08-27-per-run-db-and-background-run-scripts/.
  # Remove the placeholder (e.g. just "data/market.db") to always append to
  # one fixed file across runs instead.
  path: data/market_{run_id}.db

products:
  spot:
    enabled: true
    rest_base_url: https://api.binance.com
    ws_base_url: wss://stream.binance.com:9443
    rest_weight_per_minute: 1200
    symbol_universe: all
    symbol_list: []
    instrument_poll_minutes: 60
    kline_intervals: ["1m", "5m", "15m", "1h", "4h", "1d"]
    depth:
      enabled: true
      mode: top_n
      top_n: 50
      ranking: quote_volume
      refresh_minutes: 15

  usdm_futures:
    enabled: true
    rest_base_url: https://fapi.binance.com
    # fstream.binance.com can silently omit aggTrade/ticker/kline/markPrice/forceOrder
    ws_base_url: wss://fstream.binancefuture.com
    rest_weight_per_minute: 2000
    symbol_universe: all
    symbol_list: []
    instrument_poll_minutes: 60
    kline_intervals: ["1m", "5m", "15m", "1h", "4h", "1d"]
    depth:
      enabled: true
      mode: top_n
      top_n: 30
      ranking: quote_volume
      refresh_minutes: 15
    funding_poll_minutes: 5
    open_interest_poll_minutes: 5
    # Polls the depth-tracked symbol set only, same rationale as open interest
    # above: bound REST weight usage by the same top-N config. Endpoint paths
    # are unverified against live docs from this sandbox -- see connectors/usdm.py.
    positioning_poll_minutes: 15

  coinm_futures:
    enabled: true
    rest_base_url: https://dapi.binance.com
    ws_base_url: wss://dstream.binance.com
    rest_weight_per_minute: 2000
    symbol_universe: all
    symbol_list: []
    instrument_poll_minutes: 60
    kline_intervals: ["1m", "5m", "15m", "1h", "4h", "1d"]
    depth:
      enabled: true
      mode: top_n
      top_n: 20
      ranking: quote_volume
      refresh_minutes: 15
    funding_poll_minutes: 5
    open_interest_poll_minutes: 5
    # Polls the depth-tracked symbol set only, same rationale as open interest
    # above: bound REST weight usage by the same top-N config. Endpoint paths
    # are unverified against live docs from this sandbox -- see connectors/usdm.py.
    positioning_poll_minutes: 15

  # Options: REST mark/ticker/trades/index verified live 2026-08-27. WS host
  # nbstream returns 404 here; fstream.binancefuture.com/eoptions handshakes but
  # may deliver no frames — REST is primary. Enable when you want Options data.
  options:
    enabled: false
    rest_base_url: https://eapi.binance.com
    ws_base_url: wss://fstream.binancefuture.com/eoptions
    rest_weight_per_minute: 400
    symbol_universe: list
    symbol_list: []
    instrument_poll_minutes: 60
    kline_intervals: ["1m", "5m"]

rate_limits:
  ws_connections_per_5min: 150
  max_streams_per_connection: 100

# Dual sinks (SQLite stays primary until comparison is done).
# Start ClickHouse: docker start bmo-clickhouse  (default/bench @ :8123)
sinks:
  clickhouse:
    enabled: false
    url: http://127.0.0.1:8123
    user: default
    password: bench
    database: bmo_{run_id}
    batch_size: 500
  raw_archive:
    enabled: false
    path: data/archive_{run_id}/raw.ndjson.zst
    rotate: none  # none = one file per run; hour = rotate each UTC hour
